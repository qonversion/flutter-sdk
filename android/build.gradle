group 'com.qonversion.flutter.sdk.qonversion_flutter_sdk'
version '5.0.0'

buildscript {
    ext.kotlin_version = '1.9.25'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: 'com.android.library'

// AGP 9 enables built-in Kotlin by default, but Flutter apps can opt out while
// migrating. Older AGP versions always need the standalone Kotlin plugin.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlin = agpMajor >= 9 &&
        (project.findProperty('android.builtInKotlin') ?: 'true').toString().toBoolean()
if (!builtInKotlin) {
    pluginManager.apply('kotlin-android')
}

android {
    compileSdk = 34
    namespace = "com.qonversion.flutter.sdk.qonversion_flutter_sdk"

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

if (!builtInKotlin) {
    android.kotlinOptions {
        jvmTarget = '1.8'
    }
}
// Built-in Kotlin inherits jvmTarget from android.compileOptions. Keeping the
// legacy DSL above also supports KGP versions predating compilerOptions.

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "io.qonversion:sandwich:7.14.0"
    implementation 'com.google.code.gson:gson:2.9.0'
}
