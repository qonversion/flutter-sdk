name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout
      
      - uses: actions/setup-java@v4
        name: Setup Java
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        name: Setup Flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - run: flutter pub get
      - name: Validation
        run: flutter pub publish --dry-run

  # The sandwich pin lives in a podspec (CocoaPods) and a Package.swift (SwiftPM) per Apple platform;
  # `fastlane upgrade_sandwich version:x.y.z` bumps all of them — this gate keeps them equal.
  pins:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check the QonversionSandwich pins match
        run: |
          pins=""
          pins="$pins $(grep -oE 'io.qonversion:sandwich:[0-9.]+' android/build.gradle | grep -oE '[0-9.]+$' || true)"
          for f in ios/qonversion_flutter.podspec macos/qonversion_flutter.podspec; do
            pins="$pins $(grep -oE 's.dependency "QonversionSandwich", "[0-9.]+"' "$f" | grep -oE '"[0-9.]+"$' | tr -d '"' || true)"
          done
          for f in ios/qonversion_flutter/Package.swift macos/qonversion_flutter/Package.swift; do
            pins="$pins $(grep -oE 'sandwich-sdk.git", exact: "[0-9.]+"' "$f" | grep -oE '"[0-9.]+"$' | tr -d '"' || true)"
          done
          echo "pins (gradle, ios podspec, macos podspec, ios Package.swift, macos Package.swift):$pins"
          [ "$(echo $pins | wc -w)" -eq 5 ] && [ "$(echo $pins | tr ' ' '\n' | sort -u | wc -l)" -eq 1 ] || { echo "::error::QonversionSandwich pins differ between android/build.gradle, the podspecs and the Package.swift files"; exit 1; }

  # Builds the example app on both Apple platforms with each package manager the plugin supports.
  example:
    name: example (${{ matrix.package_manager }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package_manager: [swiftpm, cocoapods]

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
      - name: Select the package manager
        run: |
          if [ "${{ matrix.package_manager }}" = "swiftpm" ]; then
            flutter config --enable-swift-package-manager
          else
            flutter config --no-enable-swift-package-manager
          fi
      - name: Build the example for iOS (simulator)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign
      - name: Build the example for macOS
        working-directory: example
        run: flutter build macos
      - name: Show how the plugin was resolved
        working-directory: example
        run: |
          if [ "${{ matrix.package_manager }}" = "swiftpm" ]; then
            cat ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
            cat macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
          else
            grep -n -E 'qonversion_flutter|QonversionSandwich|Qonversion \(' ios/Podfile.lock macos/Podfile.lock
          fi
